name: Rotate fallback stories

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 48 new stories
        id: gen
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/update_stories.py

      - name: Write worker fallbacks
        run: |
          set -euo pipefail

          mapfile -t ALL < <(grep -v '^[[:space:]]*$' stories.txt)

          COUNT="${#ALL[@]}"
          if [ "$COUNT" -lt 48 ]; then
            echo "Expected at least 48 stories, found $COUNT"
            exit 1
          fi

          mkdir -p state fallback

          if [ "${{ steps.gen.outcome }}" = "success" ]; then
            echo "New bank generated; seeding slot 0 for each worker"
            printf '%s\n' "${ALL[0]}"  > fallback/worker-1.txt
            printf '%s\n' "${ALL[12]}" > fallback/worker-2.txt
            printf '%s\n' "${ALL[24]}" > fallback/worker-3.txt
            printf '%s\n' "${ALL[36]}" > fallback/worker-4.txt
            printf '1=1\n2=1\n3=1\n4=1\n' > state/indexes.txt
            exit 0
          fi

          echo "Generation skipped or failed; rotating inside the existing bank"

          if [ ! -f state/indexes.txt ]; then
            printf '1=0\n2=0\n3=0\n4=0\n' > state/indexes.txt
          fi

          declare -A IDX
          while IFS='=' read -r worker index; do
            [ -n "${worker:-}" ] || continue
            IDX["$worker"]="$index"
          done < state/indexes.txt

          : > state/indexes.txt

          for worker in 1 2 3 4; do
            start=$(( (worker - 1) * 12 ))
            current="${IDX[$worker]:-0}"
            current=$(( current % 12 ))
            pick=$(( start + current ))
            printf '%s\n' "${ALL[$pick]}" > "fallback/worker-${worker}.txt"
            next=$(( (current + 1) % 12 ))
            echo "${worker}=${next}" >> state/indexes.txt
            echo "worker-${worker}: used bank slot ${current} (line $((pick + 1)))"
          done

      - name: Commit stories and fallbacks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories.txt state/indexes.txt fallback/worker-1.txt fallback/worker-2.txt fallback/worker-3.txt fallback/worker-4.txt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refresh stories.txt and worker fallbacks"
          git push
