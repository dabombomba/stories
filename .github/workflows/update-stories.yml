name: Update stories.txt

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 48 new stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/update_stories.py

      - name: Reseed worker fallbacks
        run: |
          set -euo pipefail
          mapfile -t ALL < <(grep -v '^[[:space:]]*$' stories.txt)
          mkdir -p state fallback
          printf '1=1\n2=1\n3=1\n4=1\n' > state/indexes.txt
          printf '%s\n' "${ALL[0]}"  > fallback/worker-1.txt
          printf '%s\n' "${ALL[12]}" > fallback/worker-2.txt
          printf '%s\n' "${ALL[24]}" > fallback/worker-3.txt
          printf '%s\n' "${ALL[36]}" > fallback/worker-4.txt

      - name: Commit updated bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories.txt state/indexes.txt fallback/worker-1.txt fallback/worker-2.txt fallback/worker-3.txt fallback/worker-4.txt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Daily refresh of stories.txt"
          git push
